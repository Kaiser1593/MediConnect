name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test:
    name: Tests (backend)
    runs-on: ubuntu-latest
    # Service MySQL disponible pour les tests d'intégration. La suite
    # actuelle est unitaire (mocks), mais la CI est prête à faire tourner
    # de vrais tests d'intégration contre une base réelle dès qu'ils
    # existent, avec le schéma français déjà chargé.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: mediconnect
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --protocol=tcp"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: mediconnect
      DB_USER: root
      DB_PASSWORD: test_password
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 1h
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Charger le schéma MySQL
        run: mysql -h 127.0.0.1 -u root -ptest_password mediconnect < database/mediconnect.sql
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  build:
    name: Build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
