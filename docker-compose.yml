services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      # 3307 côté hôte : le 3306 est déjà pris par une instance MySQL locale.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Le schéma est chargé automatiquement au tout premier démarrage
      # (dossier vu par MySQL uniquement quand le volume est vide).
      - ./database/mediconnect.sql:/docker-entrypoint-initdb.d/mediconnect.sql
    healthcheck:
      # "-h localhost" passerait par le socket Unix, qui répond déjà
      # pendant la phase d'initialisation (le serveur temporaire utilisé
      # pour charger mediconnect.sql, avant que le vrai serveur réseau ne
      # démarre). Forcer le protocole TCP garantit que le port 3306 est
      # réellement ouvert quand le healthcheck passe au vert.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pas de volume : cache et liste noire de tokens, aucune donnée qui
    # a besoin de survivre à un redémarrage du conteneur.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "5000:5000"
    volumes:
      # Persiste les avatars uploadés entre deux redémarrages du
      # conteneur (sinon perdus à chaque "docker compose up --build").
      - backend_uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
  backend_uploads:
